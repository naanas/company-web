<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark sits on a brand-950 tile rather than on transparency: the
         artwork is solid black, which disappears against a dark browser tab
         bar, and a white-on-transparent version would disappear against a
         light one. A filled tile reads on both. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VELTECH — PT Veltera Digital Technologies</title>
    <meta
      name="description"
      content="VELTECH (PT Veltera Digital Technologies) builds SaaS solutions that turn manual operational processes in the industrial sector into integrated, efficient, and scale-ready digital systems."
    />
    <meta name="author" content="PT Veltera Digital Technologies" />
    <meta name="robots" content="index, follow" />

    <!-- These three are the defaults for a cold load of "/". Every navigation
         rewrites title, description and canonical for the route it lands on
         (see src/seo.js) — without that, /pricing and each /services/:slug
         inherited this canonical and told search engines they were duplicates
         of the home page. -->
    <link rel="canonical" href="https://veltera.cloud/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VELTECH" />
    <meta property="og:title" content="VELTECH — Digitizing Industry, One Manual Process at a Time" />
    <meta
      property="og:description"
      content="Custom SaaS solutions for operational process digitization, monitoring, and industrial system integration."
    />
    <meta property="og:url" content="https://veltera.cloud/" />
    <meta property="og:image" content="https://veltera.cloud/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VELTECH — Digitizing Industry, One Manual Process at a Time" />
    <meta
      name="twitter:description"
      content="Custom SaaS solutions for operational process digitization, monitoring, and industrial system integration."
    />
    <meta name="twitter:image" content="https://veltera.cloud/og-image.jpg" />

    <!-- Structured data. Deliberately limited to facts this repo can stand
         behind: name, legal name, URL, logo, description. Address, telephone
         and social profiles are omitted rather than guessed — the contact
         details in the app are still placeholders, and publishing invented
         business identity to search engines is worse than publishing none.
         Add `address`, `telephone` and `sameAs` here once they are real. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VELTECH",
        "legalName": "PT Veltera Digital Technologies",
        "url": "https://veltera.cloud/",
        "logo": "https://veltera.cloud/favicon.png",
        "image": "https://veltera.cloud/og-image.jpg",
        "description": "IT consulting and software house building custom systems, ERP, web and mobile applications, and data platforms."
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

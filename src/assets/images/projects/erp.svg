<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="erp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2530"/>
      <stop offset="100%" stop-color="#04070a"/>
    </linearGradient>
    <linearGradient id="erp-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#erp-bg)"/>

  <!-- side nav -->
  <rect x="0" y="0" width="120" height="400" fill="#ffffff" opacity="0.03"/>
  <circle cx="40" cy="40" r="10" fill="#22d3ee" opacity="0.8"/>
  <rect x="24" y="80" width="72" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="24" y="104" width="52" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="24" y="128" width="60" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="24" y="152" width="44" height="8" rx="4" fill="#ffffff" opacity="0.12"/>

  <!-- top bar -->
  <rect x="144" y="28" width="180" height="14" rx="7" fill="#ffffff" opacity="0.2"/>
  <rect x="480" y="24" width="96" height="22" rx="11" fill="#22d3ee" opacity="0.15"/>

  <!-- bar chart -->
  <g opacity="0.95">
    <rect x="152" y="220" width="34" height="110" rx="4" fill="url(#erp-bar)"/>
    <rect x="196" y="170" width="34" height="160" rx="4" fill="url(#erp-bar)" opacity="0.85"/>
    <rect x="240" y="240" width="34" height="90" rx="4" fill="url(#erp-bar)" opacity="0.7"/>
    <rect x="284" y="130" width="34" height="200" rx="4" fill="url(#erp-bar)"/>
    <rect x="328" y="190" width="34" height="140" rx="4" fill="url(#erp-bar)" opacity="0.8"/>
    <rect x="372" y="150" width="34" height="180" rx="4" fill="url(#erp-bar)" opacity="0.9"/>
  </g>
  <line x1="144" y1="330" x2="420" y2="330" stroke="#ffffff" stroke-opacity="0.15"/>

  <!-- stat cards -->
  <g>
    <rect x="448" y="130" width="152" height="76" rx="12" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="466" y="150" width="70" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
    <rect x="466" y="170" width="46" height="16" rx="4" fill="#22d3ee" opacity="0.6"/>
  </g>
  <g>
    <rect x="448" y="220" width="152" height="76" rx="12" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="466" y="240" width="70" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
    <rect x="466" y="260" width="60" height="16" rx="4" fill="#22d3ee" opacity="0.6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="mob-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="mob-route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#mob-bg)"/>

  <!-- abstract map grid -->
  <g stroke="#ffffff" stroke-opacity="0.06">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="260" y1="0" x2="260" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="520" y1="0" x2="520" y2="400"/>
  </g>

  <!-- route -->
  <path d="M 90 320 C 200 320 220 200 320 200 S 440 100 560 100" fill="none" stroke="url(#mob-route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <circle cx="90" cy="320" r="10" fill="#60a5fa"/>
  <circle cx="560" cy="100" r="10" fill="#3b82f6"/>
  <circle cx="320" cy="200" r="7" fill="#93c5fd"/>

  <!-- phone frame -->
  <rect x="420" y="60" width="150" height="280" rx="24" fill="#0a0f1f" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <rect x="436" y="84" width="118" height="176" rx="10" fill="#ffffff" opacity="0.05"/>
  <rect x="436" y="84" width="118" height="60" rx="10" fill="#3b82f6" opacity="0.35"/>
  <rect x="448" y="152" width="94" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
  <rect x="448" y="170" width="70" height="8" rx="4" fill="#ffffff" opacity="0.18"/>
  <rect x="448" y="188" width="80" height="8" rx="4" fill="#ffffff" opacity="0.18"/>
  <rect x="436" y="276" width="118" height="34" rx="10" fill="#60a5fa" opacity="0.9"/>
  <rect x="460" y="288" width="70" height="10" rx="5" fill="#0a0f1f" opacity="0.7"/>
</svg>

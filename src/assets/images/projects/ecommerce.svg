<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="ecom-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22072f"/>
      <stop offset="100%" stop-color="#08040c"/>
    </linearGradient>
    <linearGradient id="ecom-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#ecom-bg)"/>

  <!-- top bar -->
  <rect x="40" y="32" width="200" height="16" rx="8" fill="#ffffff" opacity="0.2"/>
  <rect x="480" y="28" width="120" height="26" rx="13" fill="#d946ef" opacity="0.2"/>

  <!-- product grid -->
  <g>
    <rect x="40" y="88" width="132" height="150" rx="14" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="56" y="104" width="100" height="76" rx="10" fill="url(#ecom-card)" opacity="0.85"/>
    <rect x="56" y="192" width="80" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
    <rect x="56" y="208" width="50" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
  </g>
  <g>
    <rect x="188" y="88" width="132" height="150" rx="14" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="204" y="104" width="100" height="76" rx="10" fill="url(#ecom-card)" opacity="0.6"/>
    <rect x="204" y="192" width="80" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
    <rect x="204" y="208" width="50" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
  </g>
  <g>
    <rect x="336" y="88" width="132" height="150" rx="14" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="352" y="104" width="100" height="76" rx="10" fill="url(#ecom-card)" opacity="0.75"/>
    <rect x="352" y="192" width="80" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
    <rect x="352" y="208" width="50" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- cart summary panel -->
  <rect x="484" y="88" width="116" height="230" rx="14" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="500" y="106" width="84" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
  <rect x="500" y="130" width="60" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="500" y="146" width="60" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="500" y="162" width="60" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="500" y="266" width="84" height="34" rx="10" fill="#d946ef" opacity="0.85"/>

  <!-- floor line -->
  <line x1="40" y1="256" x2="468" y2="256" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
